<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b5fa5">
<title>Tower Spotter</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
body{margin:0;background:#f4f6f8;color:#1a1f24;font:15px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border:1px solid #d6dbe1;border-radius:12px;padding:22px;width:min(92vw,380px);box-shadow:0 2px 10px rgba(0,0,0,.05)}
h1{font-size:18px;margin:0 0 4px;color:#0b5fa5}p{margin:6px 0;color:#5b6672;font-size:13px}
input[type=password]{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6dbe1;border-radius:8px;font-size:17px;margin-top:8px}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:#0b5fa5;color:#fff;font-weight:600;font-size:16px}
button.sec{background:#e6edf5;color:#0b5fa5}label{display:flex;gap:8px;align-items:center;font-size:13px;color:#5b6672;margin-top:10px}
#st{font-size:13px;margin-top:10px;min-height:18px}.err{color:#b54708}.ok{color:#0a7a3d}small{color:#8a94a0;font-size:11px}
</style></head><body>
<div class="box"><h1>Tower Spotter</h1><p>Private test build for the Prini - Lahaul site visit. The tool is encrypted on the server; it opens only with the passkey and then runs on this phone, offline as well.</p>
<input id="pw" type="password" placeholder="passkey" autocomplete="current-password" autocapitalize="off">
<label><input id="rem" type="checkbox" checked> remember on this phone (no passkey next time)</label>
<button id="go">Unlock</button><button class="sec" id="forget" hidden>Forget this phone</button>
<div id="st"></div><small id="ver">build 20260904-1619</small></div>
<script>
const st = document.getElementById('st'); const say = (m, c) => { st.className = c || ''; st.textContent = m; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// service worker: caches this page and the encrypted payload so the tool opens without network
let hadController = !!navigator.serviceWorker && !!navigator.serviceWorker.controller;
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !sessionStorage.getItem('sp_reloaded')) { sessionStorage.setItem('sp_reloaded', '1'); location.reload(); } hadController = true; }); }
// IndexedDB for the remembered (non-extractable) key
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('spotter-gate', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kget() { try { const d = await idb(); return await new Promise((res, rej) => { const t = d.transaction('k').objectStore('k').get('aes'); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); }); } catch (e) { return null; } }
async function kput(k) { try { const d = await idb(); await new Promise((res, rej) => { const t = d.transaction('k', 'readwrite').objectStore('k').put(k, 'aes'); t.onsuccess = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
async function kdel() { try { const d = await idb(); await new Promise((res) => { const t = d.transaction('k', 'readwrite').objectStore('k').delete('aes'); t.onsuccess = res; t.onerror = res; }); } catch (e) {} }
let META = null;
async function meta() { if (META) return META; const r = await fetch('./payload.enc', { cache: 'no-cache' }).catch(() => fetch('./payload.enc')); if (!r.ok) throw new Error('payload not found'); META = await r.json(); return META; }
async function derive(pw, m) { const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(m.salt), iterations: m.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); }
async function open(key, m) { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(m.iv) }, key, b64(m.ct)); const html = new TextDecoder().decode(pt); document.open(); document.write(html); document.close(); }
async function unlock() { const pw = document.getElementById('pw').value; if (!pw) { say('Enter the passkey.', 'err'); return; } say('deriving key...');
  try { const m = await meta(); const key = await derive(pw, m); say('decrypting...'); if (document.getElementById('rem').checked) await kput(key); await open(key, m); }
  catch (e) { say(e.name === 'OperationError' ? 'Wrong passkey.' : ('Could not open: ' + (e.message || e)), 'err'); } }
document.getElementById('go').onclick = unlock; document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('forget').onclick = async () => { await kdel(); document.getElementById('forget').hidden = true; say('Forgotten. The passkey is needed next time.', 'ok'); };
(async () => { const k = await kget(); if (!k) return; document.getElementById('forget').hidden = false; say('opening...'); try { await open(k, await meta()); } catch (e) { say('Stored key no longer fits this build; enter the passkey.', 'err'); await kdel(); } })();
</script></body></html>
